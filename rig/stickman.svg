<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 400" aria-label="Hierarchical stickman rig">
  <g id="pelvis-root" data-part="pelvis">
    <circle cx="130" cy="224" r="15" class="sm-core"/>
    <path d="M118 224 L142 224" class="sm-hip"/>

    <g id="torso-chain" data-part="chest">
      <path d="M130 224 L130 158" class="sm-torso"/>
      <circle cx="130" cy="158" r="14" class="sm-core"/>

      <g id="neck-chain" data-part="neck">
        <path d="M130 158 L130 112" class="sm-neck"/>
        <g id="head-chain" data-part="head">
          <circle cx="130" cy="70" r="38" class="sm-head"/>
          <circle cx="143" cy="64" r="4.5" class="sm-eye"/>
        </g>
      </g>

      <g id="arm-back-upper" data-part="shoulderBack">
        <path d="M121 150 L98 202" class="sm-limb sm-back"/>
        <circle cx="98" cy="202" r="9" class="sm-joint sm-back-fill"/>
        <g id="arm-back-lower" data-part="elbowBack">
          <path d="M98 202 L91 263" class="sm-forearm sm-back"/>
          <circle cx="91" cy="263" r="9" class="sm-hand sm-back-fill"/>
        </g>
      </g>

      <g id="arm-front-upper" data-part="shoulderFront">
        <path d="M139 148 L165 201" class="sm-limb"/>
        <circle cx="165" cy="201" r="9" class="sm-joint"/>
        <g id="arm-front-lower" data-part="elbowFront">
          <path d="M165 201 L174 262" class="sm-forearm"/>
          <circle cx="174" cy="262" r="9" class="sm-hand"/>
        </g>
      </g>
    </g>

    <g id="leg-back-upper" data-part="hipBack">
      <path d="M122 224 L111 296" class="sm-leg sm-back"/>
      <circle cx="111" cy="296" r="10" class="sm-joint sm-back-fill"/>
      <g id="leg-back-lower" data-part="kneeBack">
        <path d="M111 296 L106 355" class="sm-shin sm-back"/>
        <g id="foot-back" data-part="ankleBack">
          <path d="M106 355 L137 361" class="sm-foot sm-back"/>
        </g>
      </g>
    </g>

    <g id="leg-front-upper" data-part="hipFront">
      <path d="M138 224 L149 296" class="sm-leg"/>
      <circle cx="149" cy="296" r="10" class="sm-joint"/>
      <g id="leg-front-lower" data-part="kneeFront">
        <path d="M149 296 L154 355" class="sm-shin"/>
        <g id="foot-front" data-part="ankleFront">
          <path d="M154 355 L188 361" class="sm-foot"/>
        </g>
      </g>
    </g>
  </g>
</svg>